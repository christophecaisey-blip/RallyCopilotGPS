name: Build RALLY COPILOT GPS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RallyCopilotGPS_prototype_android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: unzip -o RallyCopilotGPS_prototype_android.zip -d ./source

      - name: Find Android project
        run: |
           echo "CONTENU DU ZIP :"
           find ./source -maxdepth 5 -type f
           echo "DOSSIERS :"
           find ./source -maxdepth 4 -type d
          
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin versions
        run: |
          echo "Dossier du projet : $PROJECT_DIR"
          echo "Fichiers Gradle disponibles :"
          find ./source -name "build.gradle" -o -name "build.gradle.kts"
          
      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: RALLY-COPILOT-GPS-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
