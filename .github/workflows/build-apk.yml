name: Build RALLY COPILOT GPS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RallyCopilotGPS_prototype_android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: unzip -o RallyCopilotGPS_prototype_android.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p RallyCopilotGPS assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: RALLY-COPILOT-GPS-APK
          path: RallyCopilotGPS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
